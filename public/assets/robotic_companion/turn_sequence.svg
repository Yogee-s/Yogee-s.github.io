<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img" aria-labelledby="title">
  <title id="title">One conversation turn · voice + face stack</title>
  <style>
    .bg       { fill: #f6f7fb; }
    .card     { fill: #ffffff; stroke: #e4e6ee; stroke-width: 1; }
    .title    { fill: #14161f; font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .sub      { fill: #6b7080; font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 13px; }
    .section  { fill: #6b7080; font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .tb       { fill: #14161f; font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; }
    .smallt   { fill: #6b7080; font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 11px; }
    .chip-t   { fill: #14161f; font-family: ui-monospace, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
    .role     { font-family: ui-monospace, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

    .io-card  { fill: #ffffff; stroke: #1e66f5; stroke-width: 1.6; }
    .ml-card  { fill: #ffffff; stroke: #b3741a; stroke-width: 1.6; }
    .orc-card { fill: #ffffff; stroke: #2f8f3c; stroke-width: 1.6; }
    .ctl-card { fill: #ffffff; stroke: #6b7080; stroke-width: 1.4; }

    .io-bar   { fill: #1e66f5; }
    .ml-bar   { fill: #b3741a; }
    .orc-bar  { fill: #2f8f3c; }
    .ctl-bar  { fill: #6b7080; }

    .io-role   { fill: #1e66f5; }
    .ml-role   { fill: #b3741a; }
    .orc-role  { fill: #2f8f3c; }
    .ctl-role  { fill: #6b7080; }

    .chip     { fill: #ffffff; stroke: #d6d8df; stroke-width: 1; }
    .line     { stroke: #8b8e99; stroke-width: 1.8; fill: none; stroke-linecap: round; }
    .branch   { stroke: #2f8f3c; stroke-width: 1.8; fill: none; stroke-linecap: round; }
  </style>

  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#14161f" flood-opacity="0.06"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8e99"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f8f3c"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="680"/>

  <!-- Title -->
  <text class="title" x="700" y="46" text-anchor="middle">Conversation Turn · Voice + Face Stack</text>
  <text class="sub"   x="700" y="70" text-anchor="middle">spine: microphone → spoken reply  ·  branch: affect + visemes drive the ESP32 face in parallel</text>

  <!-- ═════════ MAIN FLOW CARD ═════════ -->
  <rect class="card" x="30" y="100" width="1340" height="340" rx="14" filter="url(#cardShadow)"/>
  <text class="section" x="54" y="126">Voice Pipeline</text>

  <!-- Spine boxes · y=170..260 -->
  <!-- Mic (IO) -->
  <g>
    <rect class="io-card" x="60" y="170" width="150" height="90" rx="10"/>
    <rect class="io-bar"  x="60" y="170" width="150" height="4" rx="2"/>
    <text class="role io-role" x="135" y="196" text-anchor="middle">IO · INPUT</text>
    <text class="tb"     x="135" y="220" text-anchor="middle">Mic</text>
    <text class="smallt" x="135" y="238" text-anchor="middle">16 kHz PCM</text>
    <text class="smallt" x="135" y="252" text-anchor="middle">ReSpeaker 4-mic</text>
  </g>

  <!-- VAD (ML) -->
  <g>
    <rect class="ml-card" x="255" y="170" width="150" height="90" rx="10"/>
    <rect class="ml-bar"  x="255" y="170" width="150" height="4" rx="2"/>
    <text class="role ml-role" x="330" y="196" text-anchor="middle">ML MODEL</text>
    <text class="tb"     x="330" y="220" text-anchor="middle">VAD</text>
    <text class="smallt" x="330" y="238" text-anchor="middle">Silero v5</text>
    <text class="smallt" x="330" y="252" text-anchor="middle">speech detection</text>
  </g>

  <!-- STT (ML) -->
  <g>
    <rect class="ml-card" x="450" y="170" width="150" height="90" rx="10"/>
    <rect class="ml-bar"  x="450" y="170" width="150" height="4" rx="2"/>
    <text class="role ml-role" x="525" y="196" text-anchor="middle">ML MODEL</text>
    <text class="tb"     x="525" y="220" text-anchor="middle">STT</text>
    <text class="smallt" x="525" y="238" text-anchor="middle">Parakeet TDT</text>
    <text class="smallt" x="525" y="252" text-anchor="middle">streaming</text>
  </g>

  <!-- Prompt build (orchestration) -->
  <g>
    <rect class="orc-card" x="645" y="170" width="160" height="90" rx="10"/>
    <rect class="orc-bar"  x="645" y="170" width="160" height="4" rx="2"/>
    <text class="role orc-role" x="725" y="196" text-anchor="middle">ORCHESTRATION</text>
    <text class="tb"     x="725" y="220" text-anchor="middle">Prompt build</text>
    <text class="smallt" x="725" y="238" text-anchor="middle">hints + history</text>
    <text class="smallt" x="725" y="252" text-anchor="middle">affect context</text>
  </g>

  <!-- LLM (ML) -->
  <g>
    <rect class="ml-card" x="850" y="170" width="150" height="90" rx="10"/>
    <rect class="ml-bar"  x="850" y="170" width="150" height="4" rx="2"/>
    <text class="role ml-role" x="925" y="196" text-anchor="middle">ML MODEL</text>
    <text class="tb"     x="925" y="220" text-anchor="middle">LLM</text>
    <text class="smallt" x="925" y="238" text-anchor="middle">on-device · streaming</text>
    <text class="smallt" x="925" y="252" text-anchor="middle">replies with [affect] tag</text>
  </g>

  <!-- Sentence split (control) -->
  <g>
    <rect class="ctl-card" x="1045" y="170" width="150" height="90" rx="10"/>
    <rect class="ctl-bar"  x="1045" y="170" width="150" height="4" rx="2"/>
    <text class="role ctl-role" x="1120" y="196" text-anchor="middle">CONTROL</text>
    <text class="tb"     x="1120" y="220" text-anchor="middle">Sentence split</text>
    <text class="smallt" x="1120" y="238" text-anchor="middle">pysbd</text>
    <text class="smallt" x="1120" y="252" text-anchor="middle">stream to TTS</text>
  </g>

  <!-- TTS (ML) -->
  <g>
    <rect class="ml-card" x="1240" y="170" width="130" height="90" rx="10"/>
    <rect class="ml-bar"  x="1240" y="170" width="130" height="4" rx="2"/>
    <text class="role ml-role" x="1305" y="196" text-anchor="middle">ML MODEL</text>
    <text class="tb"     x="1305" y="220" text-anchor="middle">TTS</text>
    <text class="smallt" x="1305" y="238" text-anchor="middle">Piper</text>
    <text class="smallt" x="1305" y="252" text-anchor="middle">24 kHz · aplay</text>
  </g>

  <!-- Spine arrows with chip labels -->
  <path class="line" d="M 210 215 L 255 215" marker-end="url(#a)"/>
  <rect class="chip" x="208" y="141" width="52" height="20" rx="10"/>
  <text class="chip-t" x="234" y="155" text-anchor="middle">chunk</text>

  <path class="line" d="M 405 215 L 450 215" marker-end="url(#a)"/>
  <rect class="chip" x="393" y="141" width="74" height="20" rx="10"/>
  <text class="chip-t" x="430" y="155" text-anchor="middle">speech clip</text>

  <path class="line" d="M 600 215 L 645 215" marker-end="url(#a)"/>
  <rect class="chip" x="586" y="141" width="72" height="20" rx="10"/>
  <text class="chip-t" x="622" y="155" text-anchor="middle">transcript</text>

  <path class="line" d="M 805 215 L 850 215" marker-end="url(#a)"/>
  <rect class="chip" x="800" y="141" width="56" height="20" rx="10"/>
  <text class="chip-t" x="828" y="155" text-anchor="middle">prompt</text>

  <path class="line" d="M 1000 215 L 1045 215" marker-end="url(#a)"/>
  <rect class="chip" x="998" y="141" width="48" height="20" rx="10"/>
  <text class="chip-t" x="1022" y="155" text-anchor="middle">reply</text>

  <path class="line" d="M 1195 215 L 1240 215" marker-end="url(#a)"/>
  <rect class="chip" x="1186" y="141" width="66" height="20" rx="10"/>
  <text class="chip-t" x="1219" y="155" text-anchor="middle">sentence</text>

  <!-- ═════ FACE BRANCH (below spine) ═════ -->
  <!-- Affect tag (orc) -->
  <g>
    <rect class="orc-card" x="850" y="340" width="150" height="76" rx="10"/>
    <rect class="orc-bar"  x="850" y="340" width="150" height="4" rx="2"/>
    <text class="role orc-role" x="925" y="362" text-anchor="middle">FACE BRANCH</text>
    <text class="tb"     x="925" y="384" text-anchor="middle">Affect tag</text>
    <text class="smallt" x="925" y="402" text-anchor="middle">[affect: happy]</text>
  </g>

  <!-- ESP32 face (io) -->
  <g>
    <rect class="io-card" x="1045" y="340" width="270" height="76" rx="10"/>
    <rect class="io-bar"  x="1045" y="340" width="270" height="4" rx="2"/>
    <text class="role io-role" x="1180" y="362" text-anchor="middle">IO · OUTPUT</text>
    <text class="tb"     x="1180" y="384" text-anchor="middle">ESP32 face screen</text>
    <text class="smallt" x="1180" y="402" text-anchor="middle">FACE v=… a=…  ·  VISEME …  ·  ~30 Hz</text>
  </g>

  <!-- LLM → Affect tag (green branch down) -->
  <path class="branch" d="M 925 260 L 925 340" marker-end="url(#g)"/>
  <rect class="chip" x="885" y="290" width="80" height="20" rx="10" stroke="#2f8f3c"/>
  <text class="chip-t" x="925" y="304" text-anchor="middle" fill="#2f8f3c">terminal tag</text>

  <!-- Affect tag → ESP32 face -->
  <path class="branch" d="M 1000 378 L 1045 378" marker-end="url(#g)"/>

  <!-- TTS → ESP32 face (viseme route down-left-down) -->
  <path class="branch" d="M 1305 260 L 1305 296 L 1180 296 L 1180 340" marker-end="url(#g)"/>
  <rect class="chip" x="1200" y="286" width="86" height="20" rx="10" stroke="#2f8f3c"/>
  <text class="chip-t" x="1243" y="300" text-anchor="middle" fill="#2f8f3c">viseme PCM</text>

  <!-- ═════════ LEGEND CARD ═════════ -->
  <rect class="card" x="30" y="470" width="1340" height="90" rx="12" filter="url(#cardShadow)"/>
  <text class="section" x="54" y="496">Node types</text>

  <rect fill="#1e66f5" x="54" y="516" width="12" height="28" rx="3"/>
  <text class="tb" x="76" y="534">I/O surface</text>
  <text class="smallt" x="76" y="552">mic · speaker · face</text>

  <rect fill="#b3741a" x="324" y="516" width="12" height="28" rx="3"/>
  <text class="tb" x="346" y="534">ML model</text>
  <text class="smallt" x="346" y="552">VAD · STT · LLM · TTS</text>

  <rect fill="#2f8f3c" x="594" y="516" width="12" height="28" rx="3"/>
  <text class="tb" x="616" y="534">Orchestration</text>
  <text class="smallt" x="616" y="552">prompt build · affect routing</text>

  <rect fill="#6b7080" x="864" y="516" width="12" height="28" rx="3"/>
  <text class="tb" x="886" y="534">Control step</text>
  <text class="smallt" x="886" y="552">sentence split · streaming</text>

  <rect fill="#2f8f3c" x="1134" y="525" width="30" height="2.5" rx="1"/>
  <text class="tb" x="1170" y="534">Face / display branch</text>
  <text class="smallt" x="1170" y="552">affect + viseme to ESP32</text>

  <!-- Footer note -->
  <text class="smallt" x="700" y="622" text-anchor="middle" style="font-style:italic">End-of-speech to first spoken syllable: under 800 ms on the Jetson Orin Nano.</text>
</svg>
